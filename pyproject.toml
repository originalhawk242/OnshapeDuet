[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-duet"
version = "0.1.0"
description = "MCP server for driving Onshape CAD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# numpy floor is 2.0, not the installed 2.5.x: 2.5 needs Python >= 3.12 but we support 3.11.
dependencies = ["mcp>=2.3,<3", "httpx>=0.28.1", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
onshape-duet = "onshape_duet.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
