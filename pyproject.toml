[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-cad-mcp"
version = "0.1.0"
description = "MCP server for driving Onshape CAD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp", "httpx", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
onshape-cad-mcp = "onshape_cad_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
